[project]
name = "download-speed"
version = "0.1.0"
description = "Консольное измерение скорости последовательных загрузок"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["З", "Н", "а", "б", "г", "е", "о", "р", "с", "у"]

[tool.mypy]
python_version = "3.11"
strict = true
